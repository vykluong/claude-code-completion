name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check src/_claude
        run: zsh -n src/_claude
      - name: Check tests/zcomp-runner.zsh
        run: zsh -n tests/zcomp-runner.zsh
      - name: Check tests/run-tests.zsh
        run: zsh -n tests/run-tests.zsh

  tests:
    name: tests
    needs: syntax
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run completion test suite
        run: zsh tests/run-tests.zsh
